<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Homework Helper | Gemini</title>
    <meta name="description" content="AI Homework Helper - Gemini Flash asosida ishlaydigan aqlli yordamchi. Uy vazifangizni yozing yoki rasmini yuboring, va men sizga yordam beraman!">
    <!-- Tailwind CSS orqali dizayn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="shortcut icon" href="favicon.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: white;
            overflow-x: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: none; /* Standart kursorni yashiramiz */
        }

        /* Custom Cursor Style */
        #cursor {
            width: 20px;
            height: 20px;
            background: #38bdf8;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease-out;
            box-shadow: 0 0 15px #38bdf8, 0 0 30px #0ea5e9;
        }

        /* Glassmorphism effekti */
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Chat maydoni skrolli */
        .chat-box {
            height: 450px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #38bdf8 transparent;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 10px;
        }

        /* Xabarlar animatsiyasi */
        .message {
            margin-bottom: 12px;
            padding: 12px 18px;
            border-radius: 20px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.6;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-msg {
            background: linear-gradient(135deg, #1e293b, #334155);
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .ai-msg {
            background: linear-gradient(135deg, #0369a1, #075985);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* Yuklanish animatsiyasi */
        .dots span {
            animation: blink 1.4s infinite both;
            height: 6px;
            width: 6px;
            background: #38bdf8;
            display: inline-block;
            border-radius: 50%;
            margin: 0 2px;
        }
        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body class="p-4">

    <!-- Custom Cursor -->
    <div id="cursor"></div>

    <div class="max-w-4xl w-full glass rounded-[32px] overflow-hidden flex flex-col">
        
        <!-- Header -->
        <header class="p-6 border-b border-white/10 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-sky-400 to-blue-500 bg-clip-text text-transparent">
                    AI Homework Helper
                </h1>
                <p class="text-gray-400 text-xs mt-1">Helper 1.5 Flash orqali ishlaydi</p>
            </div>
            <div class="h-10 w-10 rounded-full bg-black/20 flex items-center justify-center border border-black/30">
                <span class="text-white font-bold">AI</span>
            </div>
        </header>

        <!-- Chat Area -->
        <div id="chat-container" class="chat-box flex flex-col p-6 space-y-2">
            <div class="ai-msg message">
                Salom! Men sizning aqlli yordamchingizman. Menga uy vazifangiz matnini yozishingiz yoki rasmini yuborishingiz mumkin. Qanday yordam bera olaman?
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden px-8 pb-4">
            <div class="flex items-center space-x-2 text-sky-400 text-sm">
                <span>Helper 1.5 Flash</span>
                <div class="dots">
                    <span></span><span></span><span></span>
                </div>
            </div>
        </div>

        <!-- Preview Image Area -->
        <div id="preview-container" class="hidden px-6 pb-4">
            <div class="relative inline-block">
                <img id="image-preview" src="" class="w-32 h-32 object-cover rounded-xl border-2 border-sky-500 shadow-lg shadow-sky-500/20">
                <button onclick="clearImage()" class="absolute -top-2 -right-2 bg-red-500 hover:bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center shadow-lg transition">
                    &times;
                </button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-6 pt-2">
            <div class="glass rounded-2xl p-2 flex items-center gap-2 border border-white/10">
                <!-- Rasm yuklash tugmasi -->
                <label for="file-input" class="p-3 hover:bg-white/5 rounded-xl cursor-pointer transition-colors group">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-400 group-hover:text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </label>
                <input type="file" id="file-input" accept="image/*">
                
                <!-- Matn kiritish -->
                <input type="text" id="user-input" placeholder="Savolingizni kiriting..." 
                    class="flex-1 bg-transparent border-none outline-none text-white px-2 placeholder:text-gray-500">
                
                <!-- Yuborish tugmasi -->
                <button id="send-btn" class="bg-sky-500 hover:bg-sky-600 p-3 rounded-xl transition-all shadow-lg shadow-sky-500/40 active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- KONFIGURATSIYA ---
        const API_KEY = 'AIzaSyAJpgdhXonCqmkNU58G0GGzVhCMBBUt04A'; // O'zingizning API kalitingizni shu yerga qo'ying
        const API_URL =  "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent" + "?key=" + API_KEY;



        // --- DOM ELEMENTLARI ---
        const cursor = document.getElementById('cursor');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const loading = document.getElementById('loading');

        let selectedImageBase64 = null;

        // --- CUSTOM CURSOR LOGIKASI ---
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX - 10 + 'px';
            cursor.style.top = e.clientY - 10 + 'px';
        });

        // Tugmalarga borganda kursor kattalashishi
        document.querySelectorAll('button, label, input').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.transform = 'scale(2.5)';
                cursor.style.background = 'rgba(56, 189, 248, 0.3)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.transform = 'scale(1)';
                cursor.style.background = '#38bdf8';
            });
        });

        // --- RASM BILAN ISHLASH ---
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedImageBase64 = event.target.result.split(',')[1];
                    imagePreview.src = event.target.result;
                    previewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        function clearImage() {
            selectedImageBase64 = null;
            fileInput.value = '';
            previewContainer.classList.add('hidden');
        }

        // --- CHAT FUNKSIYALARI ---
        function addMessage(text, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user-msg' : 'ai-msg'}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            
            // Avtomatik skroll
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        // --- API SO'ROV ---
        async function askGemini() {
            const text = userInput.value.trim();
            if (!text && !selectedImageBase64) return;

            // UI ni yangilash
            addMessage(text || "Rasm tahlil qilinmoqda...", true);
            const currentText = text;
            const currentImg = selectedImageBase64;

            userInput.value = '';
            clearImage();
            loading.classList.remove('hidden');

            // API uchun Payload tayyorlash
            const payload = {
                contents: [{
                    parts: [
                        { text: currentText ? "Uy vazifasini tushuntirib ber: " + currentText : "Ushbu rasmda nima ko'rsatilgan? Savol bo'lsa javob ber." },
                        ...(currentImg ? [{
                            inline_data: {
                                mime_type: "image/jpeg",
                                data: currentImg
                            }
                        }] : [])
                    ]
                }]
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiResponse = data.candidates[0].content.parts[0].text;
                    addMessage(aiResponse, false);
                } else {
                    addMessage("Kechirasiz, javob topa olmadim.", false);
                }
            } catch (error) {
                addMessage("Xatolik yuz berdi. Internetni yoki API kalitni tekshiring.", false);
                console.error(error);
            } finally {
                loading.classList.add('hidden');
            }
        }

        // --- EVENTLAR ---
        sendBtn.addEventListener('click', askGemini);
        
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') askGemini();
        });
    </script>
</body>
</html>
